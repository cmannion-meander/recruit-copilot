[project]
name = "recruit-copilot-api"
version = "0.1.0"
description = "Recruit Copilot API — see docs/backend-prd.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6",
    "psycopg[binary]>=3.2",
    "procrastinate[django]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
# RUF012 flags mutable class attributes, which is Django's own idiom for Meta.constraints
# and friends — it would fire in every model file for the framework's recommended shape.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Django migrations follow Django's generated shape: class-attribute lists and
# generated import order are the convention, not a defect.
"*/migrations/*" = ["RUF012", "I001"]
